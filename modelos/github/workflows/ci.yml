# CI modelo (Morg-laws): o mesmo comando único de testes do pre-commit numa máquina limpa, e o gitleaks em todo o
# histórico. Pega o commit feito à mão sem os hooks do git. Instalar: copiar para .github/workflows/ci.yml.
# Regras (modelos/testes/test_ci.py): actions fixadas por SHA com a versão em comentário (uma tag pode ser mudada
# por quem a tem; escolha versões com pelo menos duas semanas); o token só lê; versões fixas, as mesmas da máquina
# de quem desenvolve; o gitleaks baixado com o sha256 conferido, sem action de terceiros.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version: "3.11.9"
      # Versões fixas sem --require-hashes, por escolha: um pacote republicado com a mesma versão passaria, mas
      # este job só lê o repositório e não tem segredos. Com segredos ou escrita, use um requirements com hashes.
      - name: Ferramentas com versões fixas
        run: ${{ steps.python.outputs.python-path }} -m pip install --disable-pip-version-check coverage==7.17.0 ruff==0.17.2
      - name: Ligar os portões do git (os testes da guarda do git exigem-no)
        run: git config core.hooksPath .githooks
      - name: Testes, cobertura e lint (o mesmo comando do pre-commit)
        env:
          MORG_PY: ${{ steps.python.outputs.python-path }}
          # O «só encolhe» das linhas de base dos testes prontos compara com a base do ramo de destino (por isso o
          # fetch-depth: 0): numa PR, a ponta da base; num push, a ponta de antes do push.
          MORG_BASE_DE_COMPARACAO: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: sh scripts/testar.sh

  segredos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks 8.30.1 em todo o histórico
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner .
