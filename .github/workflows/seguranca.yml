name: segurança

# Regras (o tests/test_ci_do_repositorio.py roda o modelo modelos/testes/test_ci.py contra este arquivo): actions
# fixadas por SHA com a versão em comentário; o token só lê; o checkout não guarda a credencial; o gitleaks é o
# binário oficial com o sha256 conferido, sem action de terceiros; versões fixas das ferramentas.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks 8.30.1 em todo o histórico
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner .

  agents-md-curto:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: AGENTS.md com no máximo 60 linhas
        run: |
          linhas=$(wc -l < AGENTS.md)
          echo "AGENTS.md: $linhas linhas"
          test "$linhas" -le 60

  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Todo o histórico: o «só encolhe» das linhas de base compara com a base do ramo de destino.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version: "3.11.9"
      # Versões fixas sem --require-hashes, por escolha: um pacote republicado com a mesma versão passaria, mas
      # este job só lê o repositório e não tem segredos. Com segredos ou escrita, use um requirements com hashes.
      - name: Ferramentas com versões fixas
        run: ${{ steps.python.outputs.python-path }} -m pip install --disable-pip-version-check coverage==7.17.0 ruff==0.17.2
      # O Node da versão fixada no projeto de exemplo TypeScript; o scripts/testar.sh roda o npm ci do lockfile dele.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: tests/exemplo-ts/.nvmrc
      - name: Ligar os portões do git (os testes da guarda do git exigem-no)
        run: git config core.hooksPath .githooks
      - name: Modelos testados a 100 %, moldes TypeScript, as duas línguas e ruff (scripts/testar.sh)
        env:
          MORG_PY: ${{ steps.python.outputs.python-path }}
          # A base do ramo de destino: numa PR, a ponta da base; num push, a ponta de antes do push.
          MORG_BASE_DE_COMPARACAO: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: sh scripts/testar.sh
      - name: npm audit do lockfile do exemplo (só trava alto ou crítico)
        working-directory: tests/exemplo-ts
        run: npm audit --audit-level=high
